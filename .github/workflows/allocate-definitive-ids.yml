name: Allocate definitive EFO IDs

on:
  push:
    branches: [ master ]
    paths:
      - 'src/ontology/efo-edit.owl'
  workflow_dispatch:

jobs:
  assign_ids:
    runs-on: ubuntu-latest
    container:
      # Same latest line as qc.yml — see the note there; never mix versions
      # between the owlmake environments.
      image: ghcr.io/ebispot/owlmake:latest-python
      # The image defaults to an unprivileged UID, but GitHub's container-job
      # workspace and file-command mounts require the job user to be root.
      options: --user root
    steps:
      # Shallow: nothing here reads history. The guard greps the working tree,
      # mint rewrites it, and the push adds one commit on top of HEAD. A full
      # fetch of this repository takes ~5 minutes of a ~7 minute job.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      # Only do anything if there are temporary IDs to allocate. ROBOT 1.9.7
      # cycles the edit file's anonymous rdf:Description blocks between byte
      # orders on repeated conversions, so an unconditional run could commit and
      # retrigger forever. owlmake >=0.2.2 canonicalises those blocks to a fixed
      # byte order, but the guard still avoids rewriting the edit file on pushes
      # that have nothing to allocate.
      - name: Check for temporary IDs
        id: check
        run: |
          if grep -q 'EFO_099' src/ontology/efo-edit.owl; then
            echo "Temporary EFO_099 IDs found; will allocate."
            echo "has_temp=true" >> "$GITHUB_OUTPUT"
          else
            echo "No temporary EFO_099 IDs; nothing to allocate."
            echo "has_temp=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Allocate definitive IDs
        if: steps.check.outputs.has_temp == 'true'
        run: |
          om make allocate-definitive-ids

      # The runner creates the workspace outside the container and bind-mounts it
      # in, so it belongs to the host runner's uid while these steps run as root.
      # git refuses a repository owned by another user, and the push action's
      # first command (`git config http.sslVerify false`) dies with `fatal: not
      # in a git directory` — after the IDs have been minted, so the allocation
      # is lost. `actions/checkout` marks the directory safe only in a temporary
      # global config that does not outlive its own step, so mark it again here.
      # System-wide rather than global: it then holds whatever HOME the push
      # action runs with.
      - name: Trust the checkout directory
        if: steps.check.outputs.has_temp == 'true'
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Commit and push changes
        if: steps.check.outputs.has_temp == 'true'
        uses: actions-js/push@v1.5
        with:
          github_token: ${{ secrets.EFO_ID_ALLOCATION_TOKEN }}
          message: "Replace temporary IDs by definitive IDs."
          branch: ${{ github.ref }}
