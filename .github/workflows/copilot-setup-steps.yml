name: "Copilot Setup Steps"

# Runs automatically when this file changes, so the setup can be validated, and
# on demand from the repository's "Actions" tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or Copilot will not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # No permissions are needed: the repository is checked out by Copilot after
    # these steps, and the only download is a public release asset.
    permissions: {}

    steps:
      # owlmake is a single static binary and is the whole ontology toolchain: it
      # provides `robot`'s command surface natively, so there is no JDK, no
      # robot.jar and no ODK image to install. The runner's preinstalled python3
      # covers the repo's own scripts (they import stdlib only).
      - name: Install owlmake
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/EBISPOT/owlmake/releases/latest/download/om-linux-amd64 \
            -o "$HOME/.local/bin/om"
          chmod +x "$HOME/.local/bin/om"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/om" --version

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # `aurelian fulltext PMID:nnn` is how the agent reads a publication. Installed
      # as a uv TOOL, not into a venv: a tool lands on `$HOME/.local/bin`, which is
      # already on PATH above, so it is still there when the agent runs. (A venv
      # activated inside a setup step is gone by the next one.)
      - name: Install aurelian
        run: uv tool install aurelian
