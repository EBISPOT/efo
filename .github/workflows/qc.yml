# Ontology QC via owlmake

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "ontology_qc"
  ontology_qc:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # EFO and owlmake are developed together, so every environment tracks
    # owlmake's latest (this image, allocate-definitive-ids.yml, the
    # copilot-setup binary, and the README's editor install) — one version line,
    # never mixed. owlmake.yaml's min_owlmake_version is the floor that fails
    # the build if an environment lags it.
    container:
      image: ghcr.io/ebispot/owlmake:latest-python
      # The image defaults to an unprivileged UID, but GitHub's container-job
      # workspace and file-command mounts require the job user to be root.
      options: --user root

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Run ontology QC checks
        # gh_actions = qc + build/efo.owl.
        # (Bare `om` would run the default targets, which include `release`.)
        run: om make gh_actions
