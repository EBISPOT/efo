# Basic ODK workflow

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "ontology_qc"
  ontology_qc:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Pinned to a minor so a new owlmake major/minor is adopted deliberately;
    # owlmake.yaml's min_owlmake_version states the floor this must satisfy.
    container:
      image: ghcr.io/ebispot/owlmake:0.2-python
      # The image defaults to an unprivileged UID, but GitHub's container-job
      # workspace and file-command mounts require the job user to be root.
      options: --user root

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Run ontology QC checks
        env:
          DEFAULT_BRANCH: master
        # gh_actions = qc + build/efo.owl, the same target the Makefile CI ran.
        # (Bare `om` would run the default targets, which include `release`.)
        run: om make gh_actions
