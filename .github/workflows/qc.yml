# Basic ODK workflow

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "ontology_qc"
  ontology_qc:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:v1.5.1

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Fetch Mondo mirror
        run: |
          mkdir -p src/ontology/mirror
          curl -sL http://purl.obolibrary.org/obo/mondo/mondo-base.owl > src/ontology/mirror/mondo.owl

      # oba_import.owl and pr_import.owl are gitignored (too large for GitHub,
      # same as mondo_import.owl above) and regenerated from these mirrors by
      # the imports/%_import.owl Makefile rules.
      - name: Fetch OBA mirror
        run: |
          mkdir -p src/ontology/mirror
          curl -sL http://purl.obolibrary.org/obo/oba.owl > src/ontology/mirror/oba.owl

      - name: Fetch PR mirror
        run: |
          mkdir -p src/ontology/mirror
          curl -sL http://purl.obolibrary.org/obo/pr.owl > src/ontology/mirror/pr.owl

      - name: Run ontology QC checks
        env:
          DEFAULT_BRANCH: master
        # PR's mirror is ~1GB; parsing it needs the JAXP entity-size limits raised
        # (default 100,000 rejects it as a billion-laughs risk) alongside the heap size.
        run: cd src/ontology && make ROBOT_ENV='ROBOT_JAVA_ARGS=-Xmx6G' ROBOT_JAVA_ARGS="-Xmx6g -Djdk.xml.maxGeneralEntitySizeLimit=0 -Djdk.xml.totalEntitySizeLimit=0" gh_actions

