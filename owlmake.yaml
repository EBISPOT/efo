- target: report_test
  input: src/ontology/efo-edit.owl
  needs:
  - src/ontology/efo-edit.owl
  steps:
  - op: owlmake-cli
    command: report
    args:
    - -i
    - src/ontology/efo-edit.owl
    - -p
    - src/ontology/profile.txt
    - --base-iri
    - http://www.ebi.ac.uk/efo/EFO_
    - --print
    - '10'
    - -o
    - src/ontology/reports/efo-edit-report.tsv
