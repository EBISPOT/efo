min_owlmake_version: 0.2.2
id: efo
version: 3.93.0
version_file: src/ontology/version.txt
ontology_iri: http://purl.obolibrary.org/obo/efo.owl
reasoner: ELK
imports:
- id: mondo
  source: http://purl.obolibrary.org/obo/mondo/mondo-base.owl
  output: src/ontology/imports/mondo_import.owl
  steps:
  - op: extract
    method: BOT
    term_files:
    - src/ontology/iri_dependencies/mondo_terms.txt
    - src/ontology/iri_dependencies/efo-relations.txt
    copy_ontology_annotations: false
  - op: annotate
    ontology_iri: http://www.ebi.ac.uk/efo/imports/mondo_import.owl
  - op: round-trip
    output: src/ontology/imports/mondo_import.owl.tmp.owl
  - op: query
    selects:
    - query: src/sparql/hgnc_terms.sparql
      output: src/ontology/imports/mondo_import.owl.hgnc.tsv
    may_fail: true
  - op: branch
    if:
      condition: file_non_empty
      filename: src/ontology/imports/mondo_import.owl.hgnc.tsv
    then:
    - op: shell
      command: tail -n +2 src/ontology/imports/mondo_import.owl.hgnc.tsv | sed 's/[<>]//g' | grep -v '^$' > src/ontology/imports/mondo_import.owl.hgnc.txt
    - op: branch
      if:
        condition: file_non_empty
        filename: src/ontology/imports/mondo_import.owl.hgnc.txt
      then:
      - op: shell
        command: echo "Auto-excluding $(wc -l < src/ontology/imports/mondo_import.owl.hgnc.txt | tr -d ' ') HGNC terms from mondo import"
      - op: append
        src:
        - src/ontology/imports/mondo_import.owl.hgnc.txt
        dst: src/ontology/iri_dependencies/mondo_exclude.txt
      - op: sort
        input: src/ontology/iri_dependencies/mondo_exclude.txt
        output: src/ontology/iri_dependencies/mondo_exclude.txt
        unique: true
  - op: remove-terms
    terms:
    - rdfs:comment
    term_files:
    - src/ontology/iri_dependencies/mondo_exclude.txt
  - op: remove-file
    paths:
    - src/ontology/imports/mondo_import.owl.tmp.owl
    - src/ontology/imports/mondo_import.owl.hgnc.tsv
    - src/ontology/imports/mondo_import.owl.hgnc.txt
    force: true
  product:
    id: mondo
    mirror_from: http://purl.obolibrary.org/obo/mondo/mondo-base.owl
    make_base: false
    use_base: false
    base_iris: []
    mirror_type: null
    is_large: false
- id: hancestro
