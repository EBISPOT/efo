  input: src/ontology/build/efo.owl
  needs:
  - src/ontology/build/efo.owl
  steps:
  - op: owlmake-cli
    command: verify
    args:
    - -i
    - src/ontology/build/efo.owl
    - --queries
    - src/sparql/duplicate-label-violation.sparql
    - src/sparql/nolabels-violation.sparql
    - src/sparql/multiple-label-violation.sparql
    - src/sparql/no-webulous-uris-violation.sparql
    - src/sparql/no-urigen-uris-violation.sparql
    - src/sparql/no-www-uris-violation.sparql
    - src/sparql/no-dangling-violation.sparql
    - src/sparql/id-length-violation.sparql
    - src/sparql/deprecated-violation.sparql
    - src/sparql/obsolete-replaced-whitespace-violation.sparql
    - src/sparql/wrong_efo_purl-violation.sparql
    - src/sparql/self-xref-violation.sparql
    - src/sparql/has-disease-location-union-violation.sparql
    - -O
    - src/ontology/reports
  # Non-EL class expressions are checked on the files EFO authors, not on the
  # merged release: imported ontologies carry their own non-EL axioms.
  - op: owlmake-cli
    command: verify
    args:
    - -i
    - src/ontology/efo-edit.owl
    - --queries
    - src/sparql/non-el-class-expression-violation.sparql
    - -O
    - src/ontology/reports
  - op: owlmake-cli
    command: verify
    args:
    - -i
    - src/ontology/components/efo_equivalent_class_axioms.owl
    - --queries
    - src/sparql/non-el-class-expression-violation.sparql
    - -O
    - src/ontology/reports/components
- target: all_reports
  input: src/ontology/build/efo.owl
  needs:
  - src/ontology/build/efo.owl
  steps:
  - op: query
    selects:
    - query: src/sparql/basic-report.sparql
      output: src/ontology/reports/basic-report.tsv
    - query: src/sparql/class-count-by-prefix.sparql
      output: src/ontology/reports/class-count-by-prefix.tsv
    - query: src/sparql/edges.sparql
      output: src/ontology/reports/edges.tsv
    - query: src/sparql/xrefs.sparql
      output: src/ontology/reports/xrefs.tsv
    - query: src/sparql/obsoletes.sparql
      output: src/ontology/reports/obsoletes.tsv
    - query: src/sparql/synonyms.sparql
      output: src/ontology/reports/synonyms.tsv
    - query: src/sparql/obsolete_gwas.sparql
      output: src/ontology/reports/obsolete_gwas.tsv
